name: Build DigiScanim EXE

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write  # Grants the token permission to upload assets to Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python numpy pillow numba

      - name: Compile DigiScanim to EXE
        run: |
          pyinstaller --onefile --noconsole --collect-all numba DigiScanim.py

      - name: Upload EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/DigiScanim.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
